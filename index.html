<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Route Lab</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <span class="title">Route Lab</span>
    <span id="status" class="status idle">Idle</span>
  </header>

  <section class="panel">
    <div class="steps">
      <span id="steps" class="steps-value">0</span>
      <span class="steps-label">steps</span>
      <span id="motionStatus" class="motion-status">Motion off</span>
    </div>

    <div class="readout">
      <div><span class="label">Latitude</span><span id="lat" class="value">—</span></div>
      <div><span class="label">Longitude</span><span id="lng" class="value">—</span></div>
      <div><span class="label">Accuracy</span><span id="acc" class="value">—</span></div>
    </div>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <p id="motionMessage" class="message" role="status" aria-live="polite"></p>
    <div class="buttons">
      <button id="startBtn" class="btn primary" type="button">Start</button>
      <button id="recenterBtn" class="btn" type="button" disabled>Recenter</button>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
